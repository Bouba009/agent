            echo "Invoking automated weekly report on production instance..."
            curl -X POST "${{ secrets.PRODUCTION_SERVER_URL }}/api/automation/run?job=REPORT" \
              -H "Authorization: Bearer ${{ secrets.CRON_TRIGGER_TOKEN }}" || true
