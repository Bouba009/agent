package com.aromaintel.api

import com.aromaintel.agents.BusinessDiscoveryAgent
import com.aromaintel.automation.AutomationScheduler
import com.aromaintel.services.BusinessService
import com.aromaintel.services.ContentService
import com.aromaintel.services.IntelligenceService
import com.aromaintel.services.ReportService
import io.ktor.http.*
import io.ktor.server.application.*
import io.ktor.server.http.content.*
import io.ktor.server.request.*
import io.ktor.server.response.*
import io.ktor.server.routing.*

fun Application.configureRouting(
    businessService: BusinessService,
    intelligenceService: IntelligenceService,
    reportService: ReportService,
    contentService: ContentService,
    discoveryAgent: BusinessDiscoveryAgent,
    scheduler: AutomationScheduler
) {
    routing {
        // Serve lightweight web dashboard from static assets
        staticResources("/", "static", index = "index.html")

        route("/api") {
            // Businesses Endpoints
            get("/businesses") {
                val city = call.request.queryParameters["city"]
                val q = call.request.queryParameters["q"]
                val limit = call.request.queryParameters["limit"]?.toIntOrNull() ?: 100
                val offset = call.request.queryParameters["offset"]?.toLongOrNull() ?: 0L
                val results = businessService.getBusinesses(city, q, limit, offset)
                call.respond(results)
            }

            get("/businesses/{id}") {
                val id = call.parameters["id"] ?: return@get call.respond(HttpStatusCode.BadRequest, "Missing ID")
                val item = businessService.getBusinessById(id)
                if (item != null) call.respond(item) else call.respond(HttpStatusCode.NotFound)
            }

            // Market Trends Endpoint
            get("/trends") {
                val trends = intelligenceService.getTrends()
                call.respond(trends)
            }

            // Neutral Health Search Topics (Disclaimers included)
            get("/health-topics") {
                val topics = intelligenceService.getHealthTopics()
                call.respond(topics)
            }

            // AI Insights
            get("/insights") {
                val insights = intelligenceService.getInsights()
                call.respond(insights)
            }

            // Reports Endpoints
            get("/reports") {
                val reports = reportService.getReports()
                call.respond(reports)
            }

            get("/reports/{id}") {
                val id = call.parameters["id"] ?: return@get call.respond(HttpStatusCode.BadRequest, "Missing ID")
                val report = reportService.getReportById(id)
                if (report != null) call.respond(report) else call.respond(HttpStatusCode.NotFound)
            }

            post("/reports/generate") {
                val report = reportService.generateWeeklyReport()
                call.respond(HttpStatusCode.Created, report)
            }

            // Interactive Discovery Search
            post("/search") {
                val body = call.receive<SearchRequest>()
                val ingested = discoveryAgent.discover(
                    country = body.country,
                    city = body.city,
                    area = body.area,
                    category = body.category,
                    keyword = body.keyword
                )
                val results = businessService.getBusinesses(body.city, body.keyword)
                call.respond(GenericApiResponse("SUCCESS", results, "Processed $ingested candidates."))
            }

            // Content Engine Ideas
            post("/content/generate") {
                val topic = call.request.queryParameters["topic"] ?: "Sidr Honey"
                val trendData = call.request.queryParameters["trend"] ?: "+41.9% weekly growth"
                val campaign = contentService.generateCampaign(topic, trendData)
                call.respond(campaign)
            }

            // Automation Management
            get("/automation/jobs") {
                val jobs = scheduler.getRecentJobs()
                call.respond(jobs)
            }

            post("/automation/run") {
                val jobName = call.request.queryParameters["job"] ?: "DISCOVERY"
                val result = scheduler.runManualJob(jobName)
                result.onSuccess {
                    call.respond(GenericApiResponse("SUCCESS", it, "Manual job executed."))
                }.onFailure {
                    call.respond(HttpStatusCode.InternalServerError, GenericApiResponse<String>("ERROR", null, it.message))
                }
            }
        }
    }
}

