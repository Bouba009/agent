package com.aromaintel

import com.aromaintel.agents.*
import com.aromaintel.ai.OpenAICompatibleProvider
import com.aromaintel.api.configureRouting
import com.aromaintel.automation.AutomationScheduler
import com.aromaintel.collectors.DemoDataProvider
import com.aromaintel.collectors.GoogleSearchTrendCollector
import com.aromaintel.collectors.OverpassBusinessCollector
import com.aromaintel.config.AppConfig
import com.aromaintel.database.DatabaseFactory
import com.aromaintel.services.BusinessService
import com.aromaintel.services.ContentService
import com.aromaintel.services.IntelligenceService
import com.aromaintel.services.ReportService
import io.ktor.client.*
import io.ktor.client.engine.cio.*
import io.ktor.client.plugins.contentnegotiation.ContentNegotiation as ClientContentNegotiation
import io.ktor.serialization.kotlinx.json.*
import io.ktor.server.application.*
import io.ktor.server.engine.*
import io.ktor.server.netty.*
import io.ktor.server.plugins.calllogging.*
import io.ktor.server.plugins.contentnegotiation.*
import io.ktor.server.plugins.cors.routing.*
import io.ktor.server.plugins.statuspages.*
import io.ktor.http.*
import io.ktor.server.response.*
import kotlinx.coroutines.CoroutineScope
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.SupervisorJob
import kotlinx.serialization.json.Json
import org.slf4j.LoggerFactory
import org.slf4j.event.Level

fun main() {
    embeddedServer(Netty, port = System.getenv("PORT")?.toIntOrNull() ?: 8080, module = Application::module)
        .start(wait = true)
}

fun Application.module() {
    val logger = LoggerFactory.getLogger("com.aromaintel.Application")
    val config = AppConfig()

    logger.info("Initializing Natural Market Intelligence Platform (DemoMode: ${config.demoMode})...")
    DatabaseFactory.init(config)

    install(CallLogging) {
        level = Level.INFO
    }

    install(CORS) {
        anyHost()
        allowHeader(HttpHeaders.ContentType)
        allowHeader(HttpHeaders.Authorization)
        allowMethod(HttpMethod.Get)
        allowMethod(HttpMethod.Post)
        allowMethod(HttpMethod.Put)
        allowMethod(HttpMethod.Delete)
    }

    install(ContentNegotiation) {
        json(Json {
            prettyPrint = true
            isLenient = true
            ignoreUnknownKeys = true
        })
    }

    install(StatusPages) {
        exception<Throwable> { call, cause ->
            logger.error("Unhandled API error: ${cause.message}", cause)
            call.respond(HttpStatusCode.InternalServerError, mapOf("error" to (cause.message ?: "Server Error")))
        }
    }

    val httpClient = HttpClient(CIO) {
        install(ClientContentNegotiation) {
            json(Json { ignoreUnknownKeys = true; isLenient = true })
        }
    }

    // Assembly with pluggable providers
    val aiProvider = OpenAICompatibleProvider(httpClient, config)
    val demoProvider = DemoDataProvider()

    val businessProviders = if (config.demoMode) {
        listOf(demoProvider, OverpassBusinessCollector(httpClient))
    } else {
        listOf(OverpassBusinessCollector(httpClient))
    }

    val trendProviders = if (config.demoMode) {
        listOf(demoProvider, GoogleSearchTrendCollector(httpClient))
    } else {
        listOf(GoogleSearchTrendCollector(httpClient))
    }

    val discoveryAgent = BusinessDiscoveryAgent(businessProviders)
    val trendAgent = TrendIntelligenceAgent(trendProviders)
    val healthAgent = HealthTopicsAgent()
    val competitorAgent = CompetitorIntelligenceAgent(aiProvider)

    val businessService = BusinessService()
    val intelligenceService = IntelligenceService()
    val reportService = ReportService(aiProvider)
    val contentService = ContentService(aiProvider)

    val appScope = CoroutineScope(SupervisorJob() + Dispatchers.Default)
    val scheduler = AutomationScheduler(
        config = config,
        discoveryAgent = discoveryAgent,
        trendAgent = trendAgent,
        healthAgent = healthAgent,
        competitorAgent = competitorAgent,
        reportService = reportService
    )

    scheduler.start(appScope)

    configureRouting(
        businessService = businessService,
        intelligenceService = intelligenceService,
        reportService = reportService,
        contentService = contentService,
        discoveryAgent = discoveryAgent,
        scheduler = scheduler
    )
}

