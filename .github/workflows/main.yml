src/main/kotlin/com/aromaintel/analytics/DeduplicationEngine.kt

package com.aromaintel.analytics

import com.aromaintel.models.RawBusinessInput
import kotlin.math.*

object DeduplicationEngine {

    fun normalizeName(name: String): String {
        return name.lowercase()
            .replace(Regex("[^a-z0-9\\u0600-\\u06FF]"), "")
            .trim()
    }

    fun normalizePhone(phone: String?): String? {
        if (phone.isNullOrBlank()) return null
        val digits = phone.filter { it.isDigit() }
        return if (digits.length >= 8) digits.takeLast(8) else null
    }

    fun normalizeWebsite(url: String?): String? {
        if (url.isNullOrBlank()) return null
        return url.lowercase()
            .replace(Regex("^https?://"), "")
            .replace(Regex("^www\\."), "")
            .trimEnd('/')
    }

    fun calculateHaversineDistanceMeters(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Double {
        val earthRadius = 6371000.0 // meters
        val dLat = Math.toRadians(lat2 - lat1)
        val dLon = Math.toRadians(lon2 - lon1)
        val a = sin(dLat / 2).pow(2) + cos(Math.toRadians(lat1)) * cos(Math.toRadians(lat2)) * sin(dLon / 2).pow(2)
        val c = 2 * atan2(sqrt(a), sqrt(1 - a))
        return earthRadius * c
    }

    fun isDuplicate(candidate: RawBusinessInput, existingName: String, existingPhone: String?, existingLat: Double?, existingLon: Double?, existingWeb: String?): Boolean {
        // Match condition 1: Exact normalized phone match
        val candidatePhone = normalizePhone(candidate.phone)
        val existingNormPhone = normalizePhone(existingPhone)
        if (candidatePhone != null && existingNormPhone != null && candidatePhone == existingNormPhone) {
            return true
        }

        // Match condition 2: Website canonical match
        val candidateWeb = normalizeWebsite(candidate.website)
        val existingNormWeb = normalizeWebsite(existingWeb)
        if (candidateWeb != null && existingNormWeb != null && candidateWeb == existingNormWeb) {
            return true
        }

        // Match condition 3: Name similarity + Geographic proximity within 100 meters
        val candidateNormName = normalizeName(candidate.name)
        val existingNormName = normalizeName(existingName)
        if (candidateNormName == existingNormName) {
            return true
        }

        if (candidate.latitude != null && candidate.longitude != null && existingLat != null && existingLon != null) {
            val distance = calculateHaversineDistanceMeters(candidate.latitude, candidate.longitude, existingLat, existingLon)
            if (distance < 100.0 && (candidateNormName.contains(existingNormName) || existingNormName.contains(candidateNormName))) {
                return true
            }
        }

        return false
    }
}

src/main/kotlin/com/aromaintel/analytics/TrendEngine.kt

package com.aromaintel.analytics

object TrendEngine {

    fun calculateGrowthPercentage(current: Int, previous: Int): Double {
        if (previous <= 0) return if (current > 0) 100.0 else 0.0
        val growth = ((current.toDouble() - previous.toDouble()) / previous.toDouble()) * 100.0
        return (growth * 10.0).roundToInt() / 10.0
    }

    fun determineTrendDirection(growthPercentage: Double): String {
        return when {
            growthPercentage >= 5.0 -> "RISING"
            growthPercentage <= -5.0 -> "DECLINING"
            else -> "STABLE"
        }
    }

    private fun Double.roundToInt(): Double = Math.round(this * 10.0) / 10.0
}

src/main/kotlin/com/aromaintel/agents/BusinessDiscoveryAgent.kt

package com.aromaintel.agents

import com.aromaintel.analytics.DeduplicationEngine
import com.aromaintel.collectors.BusinessDataProvider
import com.aromaintel.database.BusinessSourcesTable
import com.aromaintel.database.BusinessesTable
import com.aromaintel.database.DatabaseFactory.dbQuery
import com.aromaintel.models.RawBusinessInput
import kotlinx.datetime.Clock
import kotlinx.serialization.json.Json
import org.jetbrains.exposed.sql.*
import org.slf4j.LoggerFactory
import java.util.UUID

class BusinessDiscoveryAgent(private val providers: List<BusinessDataProvider>) {
    private val logger = LoggerFactory.getLogger(BusinessDiscoveryAgent::class.java)

    suspend fun discover(country: String, city: String, area: String?, category: String, keyword: String?): Int {
        var totalIngested = 0
        for (provider in providers) {
            try {
                logger.info("Executing collector [${provider.providerName}]...")
                val candidates = provider.fetchBusinesses(country, city, area, category, keyword)
                for (candidate in candidates) {
                    insertOrMerge(candidate)
                    totalIngested++
                }
            } catch (e: Exception) {
                logger.error("Collector [${provider.providerName}] failed with: ${e.message}. Continuing with remaining providers.")
            }
        }
        return totalIngested
    }

    private suspend fun insertOrMerge(candidate: RawBusinessInput) = dbQuery {
        val now = Clock.System.now().toString()
        val existingRows = BusinessesTable.selectAll().where { BusinessesTable.city eq candidate.city }.toList()

        val matchingRow = existingRows.firstOrNull { row ->
            DeduplicationEngine.isDuplicate(
                candidate = candidate,
                existingName = row[BusinessesTable.name],
                existingPhone = row[BusinessesTable.phone],
                existingLat = row[BusinessesTable.latitude],
                existingLon = row[BusinessesTable.longitude],
                existingWeb = row[BusinessesTable.website]
            )
        }

        val businessId = if (matchingRow != null) {
            val id = matchingRow[BusinessesTable.id]
            logger.info("Duplicate business detected: '${candidate.name}' matches existing '${matchingRow[BusinessesTable.name]}'. Merging sources.")
            BusinessesTable.update({ BusinessesTable.id eq id }) {
                if (matchingRow[website].isNullOrBlank() && !candidate.website.isNullOrBlank()) it[website] = candidate.website
                if (matchingRow[phone].isNullOrBlank() && !candidate.phone.isNullOrBlank()) it[phone] = candidate.phone
                if (matchingRow[email].isNullOrBlank() && !candidate.email.isNullOrBlank()) it[email] = candidate.email
                if (candidate.rating != null) {
                    it[rating] = candidate.rating
                    it[reviewCount] = candidate.reviewCount
                }
                it[confidenceScore] = minOf(1.0, matchingRow[confidenceScore] + 0.1)
                it[updatedAt] = now
            }
            id
        } else {
            val newId = UUID.randomUUID()
            BusinessesTable.insert {
                it[id] = newId
                it[name] = candidate.name
                it[normalizedName] = DeduplicationEngine.normalizeName(candidate.name)
                it[this.category] = candidate.category
                it[this.country] = candidate.country
                it[this.city] = candidate.city
                it[this.area] = candidate.area
                it[address] = candidate.address
                it[latitude] = candidate.latitude
                it[longitude] = candidate.longitude
                it[phone] = candidate.phone
                it[email] = candidate.email
                it[website] = candidate.website
                it[socialMediaJson] = Json.encodeToString(candidate.socialMediaLinks)
                it[openingHours] = candidate.openingHours
                it[rating] = candidate.rating
                it[reviewCount] = candidate.reviewCount
                it[confidenceScore] = 0.85
                it[isVerified] = false
                it[createdAt] = now
                it[updatedAt] = now
            }
            newId
        }

        BusinessSourcesTable.insert {
            it[id] = UUID.randomUUID()
            it[this.businessId] = businessId
            it[sourceName] = candidate.sourceName
            it[externalId] = candidate.externalId
            it[rawPayload] = candidate.toString()
            it[collectedAt] = now
        }
    }
}

