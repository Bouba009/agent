                email = it[BusinessesTable.email],
                website = it[BusinessesTable.website],
                socialMediaLinks = runCatching { Json.decodeFromString<Map<String, String>>(it[BusinessesTable.socialMediaJson]) }.getOrDefault(emptyMap()),
                openingHours = it[BusinessesTable.openingHours],
                rating = it[BusinessesTable.rating],
                reviewCount = it[BusinessesTable.reviewCount],
                confidenceScore = it[BusinessesTable.confidenceScore],
                isVerified = it[BusinessesTable.isVerified],
                createdAt = it[BusinessesTable.createdAt],
                updatedAt = it[BusinessesTable.updatedAt]
