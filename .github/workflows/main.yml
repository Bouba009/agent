package com.aromaintel.collectors

import com.aromaintel.models.RawBusinessInput
import io.ktor.client.*
import io.ktor.client.call.*
import io.ktor.client.request.*
import io.ktor.http.*
import kotlinx.serialization.json.*
import org.slf4j.LoggerFactory

/**
 * Legitimate, open API provider using OpenStreetMap Overpass API for public business discovery.
 * Respects robot policies and rate limits.
 */
class OverpassBusinessCollector(private val httpClient: HttpClient) : BusinessDataProvider {
    override val providerName: String = "OpenStreetMap_Overpass"
    private val logger = LoggerFactory.getLogger(OverpassBusinessCollector::class.java)

    override suspend fun fetchBusinesses(
        country: String,
        city: String,
        area: String?,
        category: String,
        keyword: String?
    ): List<RawBusinessInput> {
        logger.info("Executing Overpass query for $city, $country [$category]...")
        val overpassQuery = """
            [out:json][timeout:25];
            area["name"="$city"]->.searchArea;
            (
              node["shop"~"herbalist|chemist|organic|health_food"](area.searchArea);
              way["shop"~"herbalist|chemist|organic|health_food"](area.searchArea);
            );
            out center;
        """.trimIndent()

        return runCatching {
            val response = httpClient.post("https://overpass-api.de/api/interpreter") {
                contentType(ContentType.Application.FormUrlEncoded)
                setBody("data=" + overpassQuery.encodeURLParameter())
            }

            if (!response.status.isSuccess()) {
                logger.warn("Overpass API returned status ${response.status}. Returning empty.")
                return emptyList()
            }

            val jsonResponse = response.body<JsonObject>()
            val elements = jsonResponse["elements"]?.jsonArray ?: return emptyList()

            elements.mapNotNull { element ->
                val obj = element.jsonObject
                val tags = obj["tags"]?.jsonObject ?: return@mapNotNull null
                val name = tags["name"]?.jsonPrimitive?.contentOrNull ?: return@mapNotNull null

                val lat = obj["lat"]?.jsonPrimitive?.doubleOrNull ?: obj["center"]?.jsonObject?.get("lat")?.jsonPrimitive?.doubleOrNull
                val lon = obj["lon"]?.jsonPrimitive?.doubleOrNull ?: obj["center"]?.jsonObject?.get("lon")?.jsonPrimitive?.doubleOrNull

                RawBusinessInput(
                    name = name,
                    category = tags["shop"]?.jsonPrimitive?.contentOrNull ?: category,
                    country = country,
                    city = city,
                    area = area,
                    address = tags["addr:street"]?.jsonPrimitive?.contentOrNull?.let { "$it ${tags["addr:housenumber"]?.jsonPrimitive?.contentOrNull ?: ""}".trim() },
                    latitude = lat,
                    longitude = lon,
                    phone = tags["phone"]?.jsonPrimitive?.contentOrNull ?: tags["contact:phone"]?.jsonPrimitive?.contentOrNull,
                    email = tags["email"]?.jsonPrimitive?.contentOrNull ?: tags["contact:email"]?.jsonPrimitive?.contentOrNull,
                    website = tags["website"]?.jsonPrimitive?.contentOrNull ?: tags["contact:website"]?.jsonPrimitive?.contentOrNull,
                    openingHours = tags["opening_hours"]?.jsonPrimitive?.contentOrNull,
                    sourceName = providerName,
                    externalId = "osm_${obj["id"]?.jsonPrimitive?.contentOrNull ?: ""}"
                )
            }
        }.getOrElse {
            logger.error("Failed to query Overpass API: ${it.message}")
            emptyList()
        }
    }
}

