src/main/kotlin/com/aromaintel/automation/AutomationScheduler.kt

package com.aromaintel.automation

import com.aromaintel.agents.*
import com.aromaintel.config.AppConfig
import com.aromaintel.database.AutomationJobsTable
import com.aromaintel.database.DatabaseFactory.dbQuery
import com.aromaintel.models.AutomationJobRecord
import com.aromaintel.services.ReportService
import kotlinx.coroutines.*
import kotlinx.datetime.Clock
import org.jetbrains.exposed.sql.SortOrder
import org.jetbrains.exposed.sql.insert
import org.jetbrains.exposed.sql.selectAll
import org.jetbrains.exposed.sql.update
import org.slf4j.LoggerFactory
import java.util.UUID
import kotlin.time.Duration.Companion.hours

class AutomationScheduler(
    private val config: AppConfig,
    private val discoveryAgent: BusinessDiscoveryAgent,
    private val trendAgent: TrendIntelligenceAgent,
    private val healthAgent: HealthTopicsAgent,
    private val competitorAgent: CompetitorIntelligenceAgent,
    private val reportService: ReportService
) {
    private val logger = LoggerFactory.getLogger(AutomationScheduler::class.java)

    fun start(scope: CoroutineScope) {
        logger.info("Starting autonomous market intelligence daemon...")

        // Daily discovery
        scope.launch(Dispatchers.IO) {
            while (isActive) {
                executeJob("DAILY_BUSINESS_DISCOVERY") {
                    discoveryAgent.discover("Algeria", "Algiers", "Center", "Herbalist", null)
                }
                delay(config.discoveryIntervalHours.hours)
            }
        }

        // 6-hour Trends & Health Topics refresh
        scope.launch(Dispatchers.IO) {
            while (isActive) {
                executeJob("TRENDS_AND_HEALTH_REFRESH") {
                    trendAgent.analyzeTrends("Algeria")
                    healthAgent.identifyTopics("Algeria", config.demoMode)
                    1
                }
                delay(config.trendsIntervalHours.hours)
            }
        }

        // Weekly Report & Competitor Analysis
        scope.launch(Dispatchers.IO) {
            while (isActive) {
                delay(config.reportIntervalHours.hours)
                executeJob("WEEKLY_REPORT_GENERATION") {
                    competitorAgent.auditCompetitors()
                    reportService.generateWeeklyReport()
                    1
                }
            }
        }
    }

    suspend fun runManualJob(jobName: String): Result<String> {
        return runCatching {
            when (jobName.uppercase()) {
                "DISCOVERY" -> {
                    val count = discoveryAgent.discover("Algeria", "Algiers", "Center", "Herbalist", null)
                    "Discovered and processed $count candidates."
                }
                "TRENDS" -> {
                    val trends = trendAgent.analyzeTrends("Algeria")
                    "Collected ${trends.size} trend indicators."
                }
                "HEALTH_TOPICS" -> {
                    val topics = healthAgent.identifyTopics("Algeria", config.demoMode)
                    "Identified ${topics.size} public search topics."
                }
                "COMPETITORS" -> {
                    val count = competitorAgent.auditCompetitors()
                    "Audited $count competitors."
                }
                "REPORT" -> {
                    val report = reportService.generateWeeklyReport()
                    "Generated report: ${report.title}"
                }
                else -> throw IllegalArgumentException("Unknown job identifier: $jobName")
            }
        }
    }

    suspend fun getRecentJobs(): List<AutomationJobRecord> = dbQuery {
        AutomationJobsTable.selectAll().orderBy(AutomationJobsTable.startedAt to SortOrder.DESC).limit(20).map {
            AutomationJobRecord(
                id = it[AutomationJobsTable.id].toString(),
                jobName = it[AutomationJobsTable.jobName],
                status = it[AutomationJobsTable.status],
                startedAt = it[AutomationJobsTable.startedAt],
                finishedAt = it[AutomationJobsTable.finishedAt],
                durationMs = it[AutomationJobsTable.durationMs],
                itemsProcessed = it[AutomationJobsTable.itemsProcessed],
                errorMessage = it[AutomationJobsTable.errorMessage]
            )
        }
    }

    private suspend fun executeJob(name: String, block: suspend () -> Int) {
        val jobId = UUID.randomUUID()
        val startEpoch = System.currentTimeMillis()
        val startedAt = Clock.System.now().toString()

        logger.info("Starting automation task: $name ($jobId)")
        dbQuery {
            AutomationJobsTable.insert {
                it[id] = jobId
                it[jobName] = name
                it[status] = "RUNNING"
                it[this.startedAt] = startedAt
            }
        }

        try {
            val processed = block()
            val finishedAt = Clock.System.now().toString()
            val duration = System.currentTimeMillis() - startEpoch
            dbQuery {
                AutomationJobsTable.update({ AutomationJobsTable.id eq jobId }) {
                    it[status] = "SUCCESS"
                    it[this.finishedAt] = finishedAt
                    it[durationMs] = duration
                    it[itemsProcessed] = processed
                }
            }
            logger.info("Job $name completed in ${duration}ms. Items: $processed")
        } catch (e: Exception) {
            val finishedAt = Clock.System.now().toString()
            val duration = System.currentTimeMillis() - startEpoch
            logger.error("Job $name failed: ${e.message}")
            dbQuery {
                AutomationJobsTable.update({ AutomationJobsTable.id eq jobId }) {
                    it[status] = "FAILED"
                    it[this.finishedAt] = finishedAt
                    it[durationMs] = duration
                    it[errorMessage] = e.message
                }
            }
        }
    }
}

