package com.aromaintel.ai

import com.aromaintel.config.AppConfig
import io.ktor.client.*
import io.ktor.client.call.*
import io.ktor.client.request.*
import io.ktor.http.*
import kotlinx.serialization.Serializable
import org.slf4j.LoggerFactory

@Serializable
data class OpenAiChatMessage(val role: String, val content: String)

@Serializable
data class OpenAiChatRequest(
    val model: String,
    val messages: List<OpenAiChatMessage>,
    val temperature: Double = 0.2
)

@Serializable
data class OpenAiChoice(val message: OpenAiChatMessage)

@Serializable
data class OpenAiChatResponse(val choices: List<OpenAiChoice>)

class OpenAICompatibleProvider(
    private val httpClient: HttpClient,
    private val config: AppConfig
) : AIProvider {
    private val logger = LoggerFactory.getLogger(OpenAICompatibleProvider::class.java)

    private val strictSystemDirective = """
        You are an elite Market Intelligence Analyst specialized in natural botanicals, herbalist shops, and traditional wellness products.
        Follow these strict guidelines:
        1. Only use facts, metrics, and data explicitly supplied in the prompt.
        2. Categorize all statements clearly into: [FACT], [DATA], [INFERENCE], [SUGGESTION].
        3. If data is not present, write 'DATA NOT AVAILABLE'. Never fabricate numbers or market presence.
        4. Health searches represent consumer interest volume only. Never diagnose users or assert medical cures.
    """.trimIndent()

    override suspend fun analyzeMarketData(dataJson: String): Result<String> {
        val userPrompt = """
            Analyze the following structured natural market intelligence data:
            $dataJson
            
            Synthesize:
            - Rising natural products
            - Rising search keywords
            - Emerging wellness topic interest
            - Competitor positioning & service gaps
            - Concrete market opportunities
        """.trimIndent()
        return executeChatCompletion(userPrompt)
    }

    override suspend fun generateContentHooks(topic: String, trendMetricSummary: String): Result<String> {
        val userPrompt = """
            Topic: $topic
            Growth Metrics: $trendMetricSummary
            
            Generate strictly compliant marketing ideas (NO unverified pharmaceutical or cure claims):
            - 5 TikTok ideas (Hook, Visual, CTA)
            - 5 Instagram ideas (Educational carousels, reels)
            - 5 Facebook ideas (Community discussions)
            - 5 SEO article ideas (Title and primary keyword)
            - 10 targeted keywords
            - 5 short video hooks (First 3 seconds)
        """.trimIndent()
        return executeChatCompletion(userPrompt)
    }

    override suspend fun generateWeeklySummary(reportContext: String): Result<String> {
        val userPrompt = """
            Synthesize this weekly natural products market performance data into a concise executive summary:
            $reportContext
        """.trimIndent()
        return executeChatCompletion(userPrompt)
    }

    private suspend fun executeChatCompletion(prompt: String): Result<String> {
        if (config.aiApiKey.isBlank()) {
            logger.warn("AI_API_KEY is empty. Providing rule-based factual output.")
            return Result.success("[DATA] Processed from database metrics. [INFERENCE] Configure AI_API_KEY for deep LLM synthesis.")
        }

        return runCatching {
            val response = httpClient.post("${config.aiBaseUrl.trimEnd('/')}/chat/completions") {
                contentType(ContentType.Application.Json)
                header("Authorization", "Bearer ${config.aiApiKey}")
                setBody(
                    OpenAiChatRequest(
                        model = config.aiModel,
                        messages = listOf(
                            OpenAiChatMessage("system", strictSystemDirective),
                            OpenAiChatMessage("user", prompt)
                        )
                    )
                )
            }

            if (!response.status.isSuccess()) {
                val errorBody = response.body<String>()
                logger.error("AI Provider returned failure code ${response.status}: $errorBody")
                throw RuntimeException("AI API failure [${response.status}]")
            }

            val chatResponse = response.body<OpenAiChatResponse>()
            chatResponse.choices.firstOrNull()?.message?.content
                ?: throw RuntimeException("Empty response body received from AI endpoint.")
        }
    }
}

