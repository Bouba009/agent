src/test/kotlin/com/aromaintel/DeduplicationTest.kt

package com.aromaintel

import com.aromaintel.analytics.DeduplicationEngine
import com.aromaintel.models.RawBusinessInput
import org.junit.jupiter.api.Test
import kotlin.test.assertEquals
import kotlin.test.assertTrue

class DeduplicationTest {

    @Test
    fun testNameNormalization() {
        val raw = "  Herboristerie El-Djazair (Center) #1 ! "
        val normalized = DeduplicationEngine.normalizeName(raw)
        assertEquals("herboristerieeldjazaircenter1", normalized)
    }

    @Test
    fun testPhoneNormalization() {
        val phoneWithCountry = "+213 (0) 550-44-33-22"
        val normalized = DeduplicationEngine.normalizePhone(phoneWithCountry)
        assertEquals("50443322", normalized)
    }

    @Test
    fun testDuplicateDetectionByProximityAndName() {
        val candidate = RawBusinessInput(
            name = "El-Baraka Herbs",
            category = "Herbalist",
            country = "Algeria",
            city = "Algiers",
            latitude = 36.7538,
            longitude = 3.0588,
            sourceName = "CollectorA"
        )

        val isDup = DeduplicationEngine.isDuplicate(
            candidate = candidate,
            existingName = "El Baraka Herbs Shop",
            existingPhone = null,
            existingLat = 36.7539,
            existingLon = 3.0589,
            existingWeb = null
        )

        assertTrue(isDup, "Candidate within 20 meters with similar name should be detected as duplicate.")
    }
}

src/test/kotlin/com/aromaintel/TrendEngineTest.kt

package com.aromaintel

import com.aromaintel.analytics.TrendEngine
import org.junit.jupiter.api.Test
import kotlin.test.assertEquals

class TrendEngineTest {

    @Test
    fun testGrowthCalculation() {
        val growth = TrendEngine.calculateGrowthPercentage(current = 142, previous = 100)
        assertEquals(42.0, growth)

        val direction = TrendEngine.determineTrendDirection(growth)
        assertEquals("RISING", direction)
    }

    @Test
    fun testDecliningTrend() {
        val growth = TrendEngine.calculateGrowthPercentage(current = 80, previous = 100)
        assertEquals(-20.0, growth)

        val direction = TrendEngine.determineTrendDirection(growth)
        assertEquals("DECLINING", direction)
    }
}

10. Complete Documentation (README.md)

# Natural Market Intelligence (NMI)

An enterprise-grade, autonomous Kotlin backend and web dashboard platform specialized in herbalist shops, botanical market trends, search trends, competitor footprint auditing, and marketing opportunity generation.

## Features
- **Pluggable Data Ingestion:** OpenStreetMap Overpass integration for public shop discovery with deduplication (fuzzy name matching, phone normalization, and Haversine geo-distance).
- **Trend Intelligence Engine:** Calculates week-over-week search interest shifts, relative growth percentages, and momentum directions.
- **Health Topics Monitoring:** Purely informational consumer query analysis with strict non-diagnostic and non-medical compliance disclaimers.
- **AI Synthesis Engine:** OpenAI-compatible API client generating structured market observations and social/content hooks (strictly factual).
- **Automated Daemon Scheduler:** Background worker running 24/7 with configurable periodic discovery, trend harvesting, and weekly report synthesis.
- **Zero-Dependency Modern Dashboard:** Mobile-first dashboard featuring Leaflet map integration, Chart.js metrics, and CSV exports.

## Prerequisites
- JDK 21 (Eclipse Temurin recommended)
- PostgreSQL 15+ (or Docker)
- Gradle 8.10+

## Local Quick Start

1. **Clone repository:**
   ```bash
   git clone https://github.com/Bouba009/agent.git
   cd agent

2.  Configure Environment:

    cp .env.example .env
    # Edit .env and supply your AI_API_KEY

3.  Start with Docker Compose:

    docker compose up -d

    Open http://localhost:8080 in your browser.

Running Locally Without Docker

1.  Start PostgreSQL and run database/init.sql.
2.  Launch the backend:
    export DATABASE_URL=jdbc:postgresql://localhost:5432/aromaintel_db
    export DATABASE_USER=postgres
    export DATABASE_PASSWORD=your_password
    export AI_API_KEY=your_key
    export DEMO_MODE=true
    ./gradlew run

REST API Documentation

| Method | Endpoint                | Description                                                |
| ------ | ----------------------- | ---------------------------------------------------------- |
| `GET`  | `/api/businesses`       | List deduplicated businesses (supports `?city=` and `?q=`) |
| `GET`  | `/api/businesses/{id}`  | Get business details by UUID                               |
| `GET`  | `/api/trends`           | Get search trends and growth percentages                   |
| `GET`  | `/api/health-topics`    | Get informational public search interest topics            |
| `GET`  | `/api/insights`         | Get structured AI insights                                 |
| `GET`  | `/api/reports`          | Get weekly generated reports                               |
| `POST` | `/api/search`           | Trigger targeted business discovery                        |
| `POST` | `/api/reports/generate` | Trigger immediate weekly report compilation                |
| `POST` | `/api/automation/run`   | Execute on-demand jobs (`?job=DISCOVERY\|TRENDS\|REPORT`)  |


