package com.aromaintel.agents

import com.aromaintel.ai.AIProvider
import com.aromaintel.database.BusinessesTable
import com.aromaintel.database.CompetitorsTable
import com.aromaintel.database.DatabaseFactory.dbQuery
import kotlinx.datetime.Clock
import kotlinx.serialization.json.Json
import org.jetbrains.exposed.sql.insert
import org.jetbrains.exposed.sql.selectAll
import org.slf4j.LoggerFactory
import java.util.UUID

class CompetitorIntelligenceAgent(private val aiProvider: AIProvider) {
    private val logger = LoggerFactory.getLogger(CompetitorIntelligenceAgent::class.java)

    suspend fun auditCompetitors(): Int {
        logger.info("Running factual competitor profile audit...")
        val targetBusinesses = dbQuery {
            BusinessesTable.selectAll().limit(10).map {
                mapOf(
                    "id" to it[BusinessesTable.id].toString(),
                    "name" to it[BusinessesTable.name],
                    "city" to it[BusinessesTable.city],
                    "category" to it[BusinessesTable.category],
                    "rating" to (it[BusinessesTable.rating]?.toString() ?: "Not available"),
                    "reviews" to it[BusinessesTable.reviewCount].toString(),
                    "website" to (it[BusinessesTable.website] ?: "Not available")
                )
            }
        }

        var audited = 0
        for (biz in targetBusinesses) {
            val factualContext = "[DATA] Name: ${biz["name"]}, Category: ${biz["category"]}, Rating: ${biz["rating"]}, Reviews: ${biz["reviews"]}, Website: ${biz["website"]}"
            val observation = aiProvider.analyzeMarketData(factualContext).getOrDefault("[FACT] Footprint collected from verified sources.")

            dbQuery {
                CompetitorsTable.insert {
                    it[id] = UUID.randomUUID()
                    it[businessId] = UUID.fromString(biz["id"])
                    it[observedProducts] = Json.encodeToString(listOf(biz["category"] ?: "General Botanicals"))
                    it[contentFormat] = if (biz["website"] != "Not available") "Web Storefront" else "Local Point of Sale"
                    it[differentiationNotes] = observation
                    it[analyzedAt] = Clock.System.now().toString()
                }
            }
            audited++
        }
        return audited
    }
}

