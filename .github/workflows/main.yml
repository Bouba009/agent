let allBusinesses = [];
let allTrends = [];
let allTopics = [];
let overviewMapInstance = null;
let fullMapInstance = null;
let chartInstance = null;

function switchView(viewId) {
    document.querySelectorAll('.view-panel').forEach(p => p.classList.add('hidden'));
    const target = document.getElementById(viewId);
    if (target) target.classList.remove('hidden');

    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-emerald-600', 'text-white');
        btn.classList.add('text-slate-300');
    });
    if (event && event.target) {
        event.target.classList.add('bg-emerald-600', 'text-white');
    }

    if (viewId === 'mapView' && fullMapInstance) {
        setTimeout(() => fullMapInstance.invalidateSize(), 200);
    }
}

async function loadAllData() {
    try {
        const [bRes, tRes, hRes, iRes, rRes, jRes] = await Promise.all([
            fetch('/api/businesses'),
            fetch('/api/trends'),
            fetch('/api/health-topics'),
            fetch('/api/insights'),
            fetch('/api/reports'),
            fetch('/api/automation/jobs')
        ]);

        allBusinesses = await bRes.json();
        allTrends = await tRes.json();
        allTopics = await hRes.json();
        const insights = await iRes.json();
        const reports = await rRes.json();
        const jobs = await jRes.json();

        renderOverview(allBusinesses, allTrends);
        renderBusinesses(allBusinesses);
        renderTrends(allTrends);
        renderHealthTopics(allTopics);
        renderInsights(insights);
        renderReports(reports);
        renderJobs(jobs);

        initMaps(allBusinesses);
        renderChart(allTrends);
    } catch (err) {
        console.error("Dashboard synchronization failure:", err);
    }
}

function renderOverview(biz, trends) {
    document.getElementById('statTotalBiz').innerText = biz.length;
    if (trends.length > 0) {
        document.getElementById('statTopTrend').innerText = trends[0].query;
        document.getElementById('statPeakGrowth').innerText = `+${trends[0].growthPercentage}%`;
    }
}

function renderBusinesses(biz) {
    const tbody = document.getElementById('bizTableBody');
    tbody.innerHTML = biz.map(b => `
        <tr class="hover:bg-slate-800/40">
            <td class="p-3 font-semibold text-white">${b.name}</td>
            <td class="p-3">${b.category}</td>
            <td class="p-3">${b.city}</td>
            <td class="p-3 font-mono text-slate-400">${b.phone || 'DATA NOT AVAILABLE'}</td>
            <td class="p-3">${b.website ? `<a href="${b.website}" target="_blank" class="text-sky-400 hover:underline">Link</a>` : 'DATA NOT AVAILABLE'}</td>
            <td class="p-3 text-amber-400 font-semibold">${b.rating ? '★ ' + b.rating : 'N/A'}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 text-[10px] border border-emerald-800">${Math.round(b.confidenceScore * 100)}%</span></td>
        </tr>
    `).join('');
}

function applyBizFilter() {
    const q = document.getElementById('bizSearchInput').value.toLowerCase();
    const city = document.getElementById('bizCityInput').value.toLowerCase();
    const filtered = allBusinesses.filter(b => 
        (b.name.toLowerCase().includes(q) || (b.address && b.address.toLowerCase().includes(q))) &&
        (b.city.toLowerCase().includes(city))
    );
    renderBusinesses(filtered);
}

function renderTrends(trends) {
    const tbody = document.getElementById('trendsTableBody');
    if (trends.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-500">DATA NOT AVAILABLE</td></tr>`;
        return;
    }
    tbody.innerHTML = trends.map(t => `
        <tr class="hover:bg-slate-800/40">
            <td class="p-3 font-semibold text-white">${t.query}</td>
            <td class="p-3">${t.category}</td>
            <td class="p-3">${t.currentInterest}</td>
            <td class="p-3">${t.previousInterest}</td>
            <td class="p-3 font-bold ${t.growthPercentage >= 0 ? 'text-emerald-400' : 'text-red-400'}">${t.growthPercentage}%</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded bg-slate-800 text-[10px]">${t.direction}</span></td>
            <td class="p-3 text-slate-500">${t.source}</td>
        </tr>
    `).join('');
}

function renderHealthTopics(topics) {
    const tbody = document.getElementById('healthTableBody');
    if (topics.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">DATA NOT AVAILABLE</td></tr>`;
        return;
    }
    tbody.innerHTML = topics.map(h => `
        <tr class="hover:bg-slate-800/40">
            <td class="p-3 font-semibold text-white">${h.topic}</td>
            <td class="p-3">${h.searchInterest}</td>
            <td class="p-3 text-emerald-400 font-bold">+${h.growthPercentage}%</td>
            <td class="p-3 text-slate-400">${h.relatedQueries.join(', ')}</td>
            <td class="p-3 text-slate-500">${h.source}</td>
        </tr>
    `).join('');
}

function renderInsights(insights) {
    const container = document.getElementById('insightsGrid');
    container.innerHTML = insights.map(i => `
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-2">
            <div class="flex justify-between items-center">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800">${i.insightType}</span>
                <span class="text-xs text-slate-500">${i.confidenceLevel}</span>
            </div>
            <h5 class="font-bold text-sm text-white">${i.title}</h5>
            <p class="text-xs text-slate-300 leading-relaxed">${i.summary}</p>
            <p class="text-[11px] text-slate-500 italic">Supporting: ${i.supportingData}</p>
        </div>
    `).join('');
}

function renderReports(reports) {
    const container = document.getElementById('reportsContainer');
    container.innerHTML = reports.map(r => `
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl space-y-3">
            <div class="flex justify-between items-center">
                <h4 class="font-bold text-white">${r.title}</h4>
                <span class="text-xs text-slate-400">${r.createdAt}</span>
            </div>
            <div class="prose prose-invert max-w-none text-xs text-slate-300">${r.contentHtml}</div>
        </div>
    `).join('');
}

function renderJobs(jobs) {
    const tbody = document.getElementById('jobsTableBody');
    tbody.innerHTML = jobs.map(j => `
        <tr class="hover:bg-slate-800/40">
            <td class="p-3 font-semibold text-white">${j.jobName}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] ${j.status === 'SUCCESS' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">${j.status}</span></td>
            <td class="p-3 text-slate-400">${j.startedAt}</td>
            <td class="p-3 text-slate-400">${j.durationMs ? j.durationMs + 'ms' : '--'}</td>
            <td class="p-3 font-mono">${j.itemsProcessed}</td>
        </tr>
    `).join('');
}

function initMaps(biz) {
    if (!overviewMapInstance) {
        overviewMapInstance = L.map('overviewMap').setView([36.7538, 3.0588], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(overviewMapInstance);
    }
    if (!fullMapInstance) {
        fullMapInstance = L.map('fullMap').setView([36.7538, 3.0588], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(fullMapInstance);
    }

    biz.forEach(b => {
        if (b.latitude && b.longitude) {
            const popup = `<strong>${b.name}</strong><br/>${b.category}<br/>${b.phone || ''}`;
            L.marker([b.latitude, b.longitude]).addTo(overviewMapInstance).bindPopup(popup);
            L.marker([b.latitude, b.longitude]).addTo(fullMapInstance).bindPopup(popup);
        }
    });
}

function renderChart(trends) {
    const ctx = document.getElementById('overviewChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: trends.map(t => t.query),
            datasets: [{
                label: 'Search Interest Index',
                data: trends.map(t => t.currentInterest),
                backgroundColor: 'rgba(16, 185, 129, 0.7)',
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
                y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
            }
        }
    });
}

async function triggerJob(jobName) {
    await fetch(`/api/automation/run?job=${jobName}`, { method: 'POST' });
    setTimeout(loadAllData, 1500);
}

function exportBusinessesCSV() {
    let csv = "Name,Category,City,Address,Phone,Rating\n";
    allBusinesses.forEach(b => {
        csv += `"${b.name}","${b.category}","${b.city}","${b.address || ''}","${b.phone || ''}","${b.rating || ''}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `herbalist_businesses_${new Date().toISOString().slice(0, 10)}.csv`;
    link.click();
}

window.onload = loadAllData;

