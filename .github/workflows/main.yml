import java.util.UUID

class TrendIntelligenceAgent(private val providers: List<TrendDataProvider>) {
    private val logger = LoggerFactory.getLogger(TrendIntelligenceAgent::class.java)

    private val trackedBotanicals = listOf(
        "Sidr Honey", "Olive Oil", "Black Seed Oil", "Turmeric",
        "Chamomile Tea", "Rosemary Hydrosol", "Argan Oil", "Spices",
        "Thyme Infusion", "Fenugreek"
    )

    suspend fun analyzeTrends(country: String): List<TrendRecord> {
        val collected = mutableListOf<TrendRecord>()
        for (provider in providers) {
            try {
                val results = provider.fetchCategoryTrends(country, trackedBotanicals)
                collected.addAll(results)
            } catch (e: Exception) {
                logger.error("Trend provider [${provider.providerName}] failed: ${e.message}")
            }
        }

        if (collected.isNotEmpty()) {
            dbQuery {
                for (trend in collected) {
                    TrendsTable.insert {
                        it[id] = UUID.randomUUID()
                        it[query] = trend.query
                        it[category] = trend.category
                        it[this.country] = country
                        it[currentInterest] = trend.currentInterest
                        it[previousInterest] = trend.previousInterest
                        it[growthPercentage] = trend.growthPercentage
                        it[direction] = trend.direction
                        it[relatedKeywordsJson] = Json.encodeToString(trend.relatedKeywords)
                        it[relatedTopicsJson] = Json.encodeToString(trend.relatedTopics)
                        it[source] = trend.source
                        it[recordedAt] = Clock.System.now().toString()
                    }
                }
            }
        }

        return collected
    }
}

