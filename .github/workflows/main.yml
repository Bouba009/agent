7. Docker & Container Deployment

Dockerfile

# Stage 1: Build Application Jar
FROM gradle:8.10-jdk21 AS builder
WORKDIR /app
COPY --chown=gradle:gradle . .
RUN gradle build -x test --no-daemon

# Stage 2: Minimal Distroless Execution Image
FROM eclipse-temurin:21-jre-alpine
WORKDIR /app
COPY --from=builder /app/build/libs/*-all.jar /app/app.jar
EXPOSE 8080
ENV PORT=8080
ENTRYPOINT ["java", "-XX:+UseG1GC", "-XX:MaxRAMPercentage=80", "-jar", "/app/app.jar"]

docker-compose.yml

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nmi_postgres
    restart: always
    environment:
      POSTGRES_DB: aromaintel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_database_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: nmi_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ENVIRONMENT: production
      DEMO_MODE: "false"
      DATABASE_URL: jdbc:postgresql://postgres:5432/aromaintel_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: secure_database_password
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      DISCOVERY_INTERVAL_HOURS: 24
      TRENDS_INTERVAL_HOURS: 6
      REPORT_INTERVAL_HOURS: 168
    depends_on:
      postgres:
        condition: service_healthy

volumes:
