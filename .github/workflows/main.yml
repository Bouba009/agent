        if (!query.isNullOrBlank()) q.andWhere { BusinessesTable.name.lowerCase() like "%${query.lowercase()}%" }
        q.orderBy(BusinessesTable.createdAt to SortOrder.DESC).limit(limit, offset).map {
            Business(
                id = it[BusinessesTable.id].toString(),
                name = it[BusinessesTable.name],
                normalizedName = it[BusinessesTable.normalizedName],
                category = it[BusinessesTable.category],
                country = it[BusinessesTable.country],
