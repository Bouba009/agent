## 11. Git Commit & Push Instructions

To push this complete, working platform into your existing repository `Bouba009/agent`:

```bash
# 1. Clone your existing repository
git clone https://github.com/Bouba009/agent.git
cd agent

# 2. Add all the created files above
git add .

# 3. Commit your implementation
git commit -m "feat: complete Natural Market Intelligence Kotlin backend and dashboard platform"

# 4. Push to origin
git push origin main

Once pushed, configure your repository secrets under Settings > Secrets and
variables > Actions:

  - AI_API_KEY: Your OpenAI-compatible API key
  - AI_BASE_URL: (Optional) Custom endpoint URL (defaults to
    https://api.openai.com/v1)
  - AI_MODEL: (Optional) Model name (defaults to gpt-4o-mini)

The scheduled GitHub Actions workflow and internal daemon will continuously
track data 24/7 without requiring any local computer or device to remain open.
