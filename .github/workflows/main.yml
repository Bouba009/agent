2. Database Schema & Migration (database/init.sql)

This SQL file initializes the PostgreSQL schema with UUID primary keys, audit
timestamps, and indexing for geo-spatial coordinates and normalized business
names.

-- database/init.sql
CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

-- Data Sources tracking registry
CREATE TABLE IF NOT EXISTS data_sources (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    source_name VARCHAR(100) NOT NULL UNIQUE,
    provider_type VARCHAR(50) NOT NULL, -- OSM, GOOGLE, SERP, DIRECT
    is_active BOOLEAN DEFAULT TRUE,
    last_accessed_at TIMESTAMP WITH TIME ZONE,
    rate_limit_per_min INT DEFAULT 60,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

-- Core businesses table (deduplicated herbalist & natural product shops)
CREATE TABLE IF NOT EXISTS businesses (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    name VARCHAR(255) NOT NULL,
    normalized_name VARCHAR(255) NOT NULL,
    category VARCHAR(100) NOT NULL,
    country VARCHAR(100) NOT NULL,
    city VARCHAR(100) NOT NULL,
    area VARCHAR(150),
    address TEXT,
    latitude DOUBLE PRECISION,
    longitude DOUBLE PRECISION,
    phone VARCHAR(50),
    email VARCHAR(255),
    website TEXT,
    social_media_json JSONB DEFAULT '{}'::jsonb,
    opening_hours TEXT,
    rating DOUBLE PRECISION,
    review_count INT DEFAULT 0,
    confidence_score DOUBLE PRECISION DEFAULT 1.0,
    is_verified BOOLEAN DEFAULT FALSE,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

CREATE INDEX IF NOT EXISTS idx_businesses_city ON businesses(city);
CREATE INDEX IF NOT EXISTS idx_businesses_normalized_name ON businesses(normalized_name);
CREATE INDEX IF NOT EXISTS idx_businesses_phone ON businesses(phone);
CREATE INDEX IF NOT EXISTS idx_businesses_geo ON businesses(latitude, longitude);

-- Origin audit table linking businesses to discovery runs
CREATE TABLE IF NOT EXISTS business_sources (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    business_id UUID NOT NULL REFERENCES businesses(id) ON DELETE CASCADE,
    source_name VARCHAR(100) NOT NULL,
    external_id VARCHAR(255),
    raw_payload JSONB,
    collected_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

-- Catalog of tracked natural products
CREATE TABLE IF NOT EXISTS products (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    name VARCHAR(255) NOT NULL,
    category VARCHAR(100) NOT NULL,
    scientific_name VARCHAR(255),
    description TEXT,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

-- Search trend metrics
CREATE TABLE IF NOT EXISTS trends (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    query VARCHAR(255) NOT NULL,
    category VARCHAR(100) NOT NULL,
    country VARCHAR(100) NOT NULL,
    current_interest INT NOT NULL,
    previous_interest INT NOT NULL,
    growth_percentage DOUBLE PRECISION NOT NULL,
    direction VARCHAR(20) NOT NULL, -- RISING, STABLE, DECLINING
    related_keywords_json JSONB DEFAULT '[]'::jsonb,
    related_topics_json JSONB DEFAULT '[]'::jsonb,
    source VARCHAR(100) NOT NULL,
    recorded_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

CREATE INDEX IF NOT EXISTS idx_trends_query_country ON trends(query, country);

-- Health search topics with strictly enforced neutral search interest disclaimer
CREATE TABLE IF NOT EXISTS health_topics (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    topic VARCHAR(255) NOT NULL,
    search_interest INT NOT NULL,
    growth_percentage DOUBLE PRECISION NOT NULL,
    related_queries_json JSONB DEFAULT '[]'::jsonb,
    related_topics_json JSONB DEFAULT '[]'::jsonb,
    disclaimer TEXT NOT NULL,
    source VARCHAR(100) NOT NULL,
    recorded_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

-- Competitor analysis observations
CREATE TABLE IF NOT EXISTS competitors (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    business_id UUID NOT NULL REFERENCES businesses(id) ON DELETE CASCADE,
    observed_focus_products JSONB DEFAULT '[]'::jsonb,
    content_format VARCHAR(100),
    active_offers TEXT,
    detected_keywords JSONB DEFAULT '[]'::jsonb,
    differentiation_notes TEXT,
    analyzed_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

-- Structured AI Insights
CREATE TABLE IF NOT EXISTS ai_insights (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    insight_type VARCHAR(50) NOT NULL, -- OPPORTUNITY, PRODUCT, KEYWORD, CONTENT, COMPETITOR
    title VARCHAR(255) NOT NULL,
    summary TEXT NOT NULL,
    supporting_data TEXT,
    source VARCHAR(100) NOT NULL,
    confidence_level VARCHAR(20) DEFAULT 'HIGH', -- HIGH, MEDIUM, SPECULATIVE
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

-- Autonomous Weekly Reports
CREATE TABLE IF NOT EXISTS reports (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    title VARCHAR(255) NOT NULL,
    period_start TIMESTAMP WITH TIME ZONE NOT NULL,
    period_end TIMESTAMP WITH TIME ZONE NOT NULL,
    content_markdown TEXT NOT NULL,
    content_html TEXT NOT NULL,
    content_json JSONB NOT NULL,
    data_sources_summary JSONB NOT NULL,
    data_quality_score DOUBLE PRECISION DEFAULT 1.0,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

-- Scheduled automation execution log
CREATE TABLE IF NOT EXISTS automation_jobs (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    job_name VARCHAR(100) NOT NULL,
    status VARCHAR(50) NOT NULL, -- RUNNING, SUCCESS, FAILED, PARTIAL
    started_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    finished_at TIMESTAMP WITH TIME ZONE,
    duration_ms BIGINT,
    items_processed INT DEFAULT 0,
    error_message TEXT
);

-- User discovery queries log
CREATE TABLE IF NOT EXISTS search_history (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    country VARCHAR(100) NOT NULL,
    city VARCHAR(100) NOT NULL,
    category VARCHAR(100),
    keyword VARCHAR(100),
    results_count INT DEFAULT 0,
    searched_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

